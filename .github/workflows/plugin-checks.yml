name: Plugin checks

on:
  pull_request:
  push:
    branches:
      - integration/plane-freeframe-review

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run plugin checks
        run: |
          set -o pipefail
          npm run check 2>&1 | tee plugin-check.log
      - name: Upload failed check log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-check-log
          path: plugin-check.log
          if-no-files-found: error
          retention-days: 3
